<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test</title>
<style>
  body { background:#111; color:#fff; font-family:sans-serif; padding:40px 20px; text-align:center; }
  button { background:#00e5a0; color:#000; border:none; padding:20px 40px; font-size:20px; border-radius:12px; margin:20px; width:80%; }
  #msg { margin-top:20px; font-size:18px; color:#00e5a0; min-height:40px; }
</style>
</head>
<body>
  <h2>Prueba de botón</h2>
  <p>Toca el botón:</p>
  <button id="btn1">TOCA AQUÍ</button>
  <div id="msg">Esperando...</div>

<script>
  document.getElementById('btn1').addEventListener('click', function() {
    document.getElementById('msg').textContent = '✅ Click funcionó!';
  });
  document.getElementById('btn1').addEventListener('touchend', function(e) {
    e.preventDefault();
    document.getElementById('msg').textContent = '✅ Touch funcionó!';
  });
  document.getElementById('msg').textContent = 'JS cargó correctamente ✓';
</script>
</body>
</html>
