<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Login</title>
<style>
  body { background:#111; color:#fff; font-family:sans-serif; padding:30px 20px; }
  input { width:100%; padding:14px; margin:8px 0; background:#222; border:1px solid #444; 
          color:#fff; border-radius:8px; font-size:16px; box-sizing:border-box; }
  button { width:100%; padding:16px; background:#00e5a0; color:#000; border:none; 
           border-radius:8px; font-size:18px; font-weight:bold; margin-top:10px; }
  #msg { margin-top:16px; padding:14px; border-radius:8px; font-size:14px; 
         background:#222; min-height:50px; word-break:break-all; line-height:1.6; }
</style>
</head>
<body>
  <h2>Test Login</h2>
  <input type="text" id="user" placeholder="usuario" autocapitalize="none">
  <input type="password" id="pass" placeholder="contraseña">
  <button id="btn">INGRESAR</button>
  <div id="msg">Listo para probar...</div>

<script>
var URL_USERS = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRzUOunw18bewpoYcMaz_FhfOX9yw9EkDjpLAUNU2CwpwVzcncFevzMrElZ9Jnk_Fg3E6r6hZHZNZlH/pub?gid=0&single=true&output=csv';

function log(msg, color) {
  var el = document.getElementById('msg');
  el.style.color = color || '#fff';
  el.textContent = msg;
}

document.getElementById('btn').addEventListener('touchend', function(e) {
  e.preventDefault();
  intentarLogin();
});
document.getElementById('btn').addEventListener('click', function() {
  intentarLogin();
});

function intentarLogin() {
  var user = document.getElementById('user').value.trim().toLowerCase();
  var pass = document.getElementById('pass').value.trim();

  if (!user || !pass) { log('Ingresa usuario y contraseña', '#ff4d6d'); return; }

  log('Paso 1: Conectando a Google Sheets...', '#ffb347');

  var xhr = new XMLHttpRequest();
  xhr.open('GET', URL_USERS + '&_t=' + Date.now(), true);
  xhr.timeout = 10000;

  xhr.onload = function() {
    log('Paso 2: Respuesta recibida. Status: ' + xhr.status + ' | Largo: ' + xhr.responseText.length, '#ffb347');
    if (xhr.status === 200 && xhr.responseText.length > 5) {
      verificar(user, pass, xhr.responseText);
    } else {
      log('Error HTTP ' + xhr.status + '. Intentando proxy...', '#ff4d6d');
      usarProxy(user, pass);
    }
  };
  xhr.onerror = function() {
    log('Error de red directo. Intentando proxy...', '#ffb347');
    usarProxy(user, pass);
  };
  xhr.ontimeout = function() {
    log('Timeout. Intentando proxy...', '#ffb347');
    usarProxy(user, pass);
  };
  xhr.send();
}

function usarProxy(user, pass) {
  var proxy = 'https://corsproxy.io/?' + encodeURIComponent(URL_USERS);
  var xhr2 = new XMLHttpRequest();
  xhr2.open('GET', proxy, true);
  xhr2.timeout = 10000;
  xhr2.onload = function() {
    log('Proxy respondió. Status: ' + xhr2.status + ' | Largo: ' + xhr2.responseText.length, '#ffb347');
    if (xhr2.status === 200 && xhr2.responseText.length > 5) {
      verificar(user, pass, xhr2.responseText);
    } else {
      log('Proxy falló también. Sin conexión.', '#ff4d6d');
    }
  };
  xhr2.onerror   = function() { log('Proxy: error de red.', '#ff4d6d'); };
  xhr2.ontimeout = function() { log('Proxy: timeout.', '#ff4d6d'); };
  xhr2.send();
}

function verificar(user, pass, csv) {
  var lines = csv.split('\n');
  log('Paso 3: CSV recibido. Filas: ' + lines.length, '#ffb347');

  for (var i = 1; i < lines.length; i++) {
    var cols = lines[i].split(',');
    var u = (cols[0] || '').trim().toLowerCase().replace(/"/g,'');
    var p = (cols[1] || '').trim().replace(/"/g,'');
    if (u === user && p === pass) {
      log('✅ LOGIN CORRECTO! Bienvenido: ' + (cols[2]||u).replace(/"/g,''), '#00e5a0');
      return;
    }
  }
  log('❌ Usuario o contraseña incorrectos. User ingresado: [' + user + '] Pass: [' + pass + ']', '#ff4d6d');
}
</script>
</body>
</html>
